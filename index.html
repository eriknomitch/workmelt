<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- user-scalable=no / maximum-scale=1: pinch zoom over a live FPS canvas
         is never intent, and a double-tap zoom mid-firefight is a soft-lock.
         The menus honour OS-level accessibility zoom, which this cannot block. -->
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>WORKMELT — Tactical Shooter</title>
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="WORKMELT — a browser-first tactical arena built out of the floor you already work on."
    />
    <!--
      Favicons. favicon.ico and apple-touch-icon.png sit at the root because
      browsers and iOS also probe those paths blind; everything else is under
      /icons/. Install metadata is in manifest.webmanifest.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/android-icon-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="57x57" href="/icons/apple-icon-57x57.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="/icons/apple-icon-60x60.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/icons/apple-icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="/icons/apple-icon-76x76.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="/icons/apple-icon-114x114.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-icon-120x120.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/apple-icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-icon-180x180.png" />
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#000000" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="WORKMELT" />
    <meta name="application-name" content="WORKMELT" />
    <meta name="msapplication-TileImage" content="/icons/ms-icon-144x144.png" />
    <meta name="msapplication-TileColor" content="#000000" />
    <!--
      Brand type (DESIGN.md: Geist, with Geist Mono for labels) is bundled, not
      linked: src/ui/fonts.js imports it from npm, so it is served from our own
      origin and the game still runs offline (ARCHITECTURE.md rule 3). The
      stacks below and in src/ui/brand.js carry the UI until it lands.
    -->
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* Void (DESIGN.md) — the first paint is the same black the lobby is. */
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000000; }
      body {
        font-family: "Geist Variable", "Geist", "Inter", system-ui, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        /* Mobile: no rubber-banding, no pull-to-refresh, no long-press callout
           over the game — the canvas is not a document. */
        overscroll-behavior: none;
        -webkit-touch-callout: none;
      }
      /* dvh follows the collapsing browser chrome on phones; the plain vh line
         stays first as the fallback for engines without dynamic units. */
      #game { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
      /*
        THE CURSOR RULE.

        `cursor: none` used to sit on #game unconditionally, which meant every
        surface outside pointer lock — the lobby, the pause menu, the settings
        rows — was operated with an INVISIBLE mouse. The class is toggled from
        `pointerlockchange` in src/core/input.js, the one authoritative source
        for whether the pointer is captured, so the cursor is hidden exactly
        while the game owns it and visible the rest of the time.
      */
      body.wm-pointer-locked #game { cursor: none; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
